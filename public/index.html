<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight VTT - Multiplayer</title>
    
    <!-- We keep PDF.js on CDN to bypass complex Vite worker configurations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        #controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 1200px;
            justify-content: center;
        }
        button { cursor: pointer; padding: 5px 10px; border-radius: 4px; border: 1px solid #555; }
        #vtt-container {
            border: 2px solid #444;
            border-radius: 4px;
            overflow: hidden;
            background-color: #000000;
        }
        input[type="file"] { color: #fff; }
        .divider { border-left: 1px solid #666; height: 24px; margin: 0 5px; }
    </style>
</head>
<body>

    <div id="controls">
        <select id="modeSelect" style="background: #00509e; color: white; padding: 5px; border-radius: 4px; border: 1px solid #555; font-weight: bold;">
            <option value="prep">🛠️ Prep Mode</option>
            <option value="play">🎲 Play Mode</option>
        </select>
        
        <div class="divider"></div>

        <label for="mapUpload"><strong>Map: </strong></label>
        <input type="file" id="mapUpload" accept=".png, .jpg, .jpeg, .pdf" />
        
        <button id="rotateCCW">↺ CCW</button>
        <button id="rotateCW">↻ CW</button>
        
        <span id="drawControls" style="display: flex; gap: 10px; align-items: center;">
            <div class="divider"></div>
            <button id="toggleDraw" style="background: #444; color: white;">✏️ Draw Walls: OFF</button>
            <button id="clearWalls" style="background: #444; color: white;">🗑️ Clear Walls</button>
        </span>

        <span id="lightControls" style="display: flex; gap: 10px; align-items: center;">
            <div class="divider"></div>
            <select id="lightTypeSelect" style="background: #2d2d2d; color: white; padding: 5px; border-radius: 4px; border: 1px solid #555;">
                <option value="ceiling">🟡 Ceiling Light</option>
                <option value="emergency">🔴 Emergency Light</option>
            </select>
            
            <div style="display: flex; align-items: center; gap: 8px; background: #333; padding: 2px 8px; border-radius: 4px;">
                <label for="lightRadiusInput" style="font-size: 0.9em;">Radius:</label>
                <input type="range" id="lightRadiusInput" min="50" max="1000" value="400" step="10">
            </div>

            <button id="toggleLightMode" style="background: #b8860b; color: white; border: none;">💡 Add Lights: OFF</button>
            <button id="clearLights" style="background: #444; color: white;">🗑️ Clear Lights</button>
        </span>

        <span id="tokenControls" style="display: flex; gap: 10px; align-items: center;">
            <div class="divider"></div>
            <label for="tokenCountSelect" style="font-size: 0.9em;">Players:</label>
            <select id="tokenCountSelect" style="background: #2d2d2d; color: white; padding: 5px; border-radius: 4px; border: 1px solid #555;">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6" selected>6</option>
            </select>
            
            <div style="display: flex; align-items: center; gap: 8px; background: #333; padding: 2px 8px; border-radius: 4px;">
                <label for="tokenRadiusInput" style="font-size: 0.9em;">Torch Radius:</label>
                <input type="range" id="tokenRadiusInput" min="50" max="600" value="250" step="10">
            </div>
        </span>

        <span id="lightHint" style="font-size: 0.8em; color: #aaa; display: none; width: 100%; text-align: center;">(Select a wall or light to edit. Shift+Click or press Delete to remove)</span>
    </div>

    <div id="vtt-container"></div>

    <!-- This replaces your 1000 lines of script -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
